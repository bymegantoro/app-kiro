<!-- Reusable component: Hero
     Styled by css/sections.css (.hero*) · behavior in js/hero.js -->
<section id="hero" class="hero section" data-component="hero">
  <div class="particles" id="particles" aria-hidden="true"></div>

  <div class="hero__inner container">
    <div class="hero__content">
      <span class="hero__badge">
        <span class="hero__badge-dot"></span>
        Available for opportunities
      </span>

      <h1 class="hero__title">Hi, I'm Bayu Megantoro</h1>

      <h2 class="hero__role">
        <span class="hero__typewriter" id="typewriter"></span><span class="hero__cursor">|</span>
      </h2>

      <p class="hero__tagline">
        Membangun pengalaman digital cerdas dengan AI dan teknologi web modern.
      </p>

      <div class="hero__cta">
        <a href="#" class="btn btn--primary"><span>Lihat Project</span></a>
        <a href="#" class="btn btn--ghost" download><span>Download Resume</span></a>
      </div>

      <ul class="hero__meta">
        <li><span class="hero__meta-label">Lokasi</span> Jakarta, Indonesia</li>
        <li><span class="hero__meta-label">Email</span> vita@prestasijunior.org</li>
      </ul>
    </div>

    <div class="hero__visual">
      <div class="hero__photo glass" id="heroPhoto">
        <span class="hero__photo-glow" aria-hidden="true"></span>
        <div class="hero__photo-inner">
          <img src="assets/bayu.png" alt="Foto Bayu Megantoro" class="hero__photo-img" loading="eager" />
          <span class="hero__photo-shine" aria-hidden="true"></span>
        </div>
        <span class="hero__ring hero__ring--1"></span>
        <span class="hero__ring hero__ring--2"></span>
      </div>
      <div class="hero__float-card glass hero__float-card--1">
        <span class="hero__float-icon">⚡</span>
        <div><strong>5+ Years</strong><small>Experience</small></div>
      </div>
      <div class="hero__float-card glass hero__float-card--2">
        <span class="hero__float-icon">🤖</span>
        <div><strong>AI Powered</strong><small>Solutions</small></div>
      </div>
    </div>
  </div>

  <a href="#about" class="hero__scroll" aria-label="Scroll to about">
    <span class="hero__scroll-mouse"></span>
  </a>
</section>
